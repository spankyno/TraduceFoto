<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in environments where HMR is disabled
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reason && (reason.includes('WebSocket') || reason.includes('ws://') || reason.includes('wss://'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FotoTraductor - Cámara y Traducción</title>
    <meta name="description" content="Aplicación móvil sencilla para capturar texto con la cámara y traducirlo al instante con detección automática de idioma." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
