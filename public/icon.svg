<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer camera frame accent -->
  <rect x="76" y="96" width="360" height="320" rx="48" fill="none" stroke="url(#accentGrad)" stroke-width="14" filter="url(#glow)" opacity="0.4"/>
  <rect x="76" y="96" width="360" height="320" rx="48" fill="#131e32" stroke="url(#accentGrad)" stroke-width="12"/>

  <!-- Camera bump / flash -->
  <path d="M196 96 L220 64 L292 64 L316 96 Z" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="360" cy="144" r="16" fill="#f59e0b"/>
  <circle cx="360" cy="144" r="8" fill="#fef3c7"/>

  <!-- Lens Outer Ring -->
  <circle cx="256" cy="266" r="114" fill="url(#lensGrad)" stroke="url(#accentGrad)" stroke-width="12"/>
  <circle cx="256" cy="266" r="92" fill="#0b1120" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 8" opacity="0.8"/>

  <!-- Translate Badge / Glyphs inside Lens -->
  <!-- Letter A -->
  <text x="216" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
  <!-- Transfer Arrow -->
  <path d="M242 262 L270 262 M262 254 L270 262 L262 270" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Asian character 文 (representing universal translation) -->
  <text x="296" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="bold" fill="#38bdf8" text-anchor="middle">文</text>

  <!-- Corner viewfinder brackets -->
  <path d="M106 156 L106 126 L136 126" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M406 156 L406 126 L376 126" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M106 356 L106 386 L136 386" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M406 356 L406 386 L376 386" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
</svg>
